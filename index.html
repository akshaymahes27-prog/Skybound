d-template-columns:1fr 94px}.mascot{width:90px;height:90px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.avatar-grid{grid-template-columns:repeat(3,1fr)}}
 .week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 14px}.week-cell{text-align:center;min-width:0}.week-label{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:5px}.week-circle{width:36px;height:36px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--cloud);border:2px solid var(--mist);font-size:12px;font-weight:900}.week-circle.today{border-color:var(--sky);box-shadow:0 0 0 3px var(--cloud)}.week-circle.done{background:var(--mint);border-color:var(--mint)}.week-count{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:800}.grid3[style*="margin:10px 0 12px"]{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 14px!important}.grid3[style*="margin:10px 0 12px"]>div{min-width:0;text-align:center}.grid3[style*="margin:10px 0 12px"]>div .day{width:36px;height:36px;min-height:36px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--cloud);border:2px solid var(--mist);font-size:12px}.grid3[style*="margin:10px 0 12px"]>div .day.selected{border-color:var(--sky);box-shadow:0 0 0 3px var(--cloud)}.shield{width:58px;height:64px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 14%,92% 52%,78% 78%,50% 100%,22% 78%,8% 52%,8% 14%);background:var(--shield,var(--sky));color:var(--navy);font-size:22px;font-weight:900;border:0}.shield.large{width:88px;height:98px;font-size:32px}.rank-badge{width:88px;height:98px;background:transparent!important}.tabs{grid-template-columns:repeat(5,1fr)}.avatar-choice{min-height:82px}.avatar-choice span{display:none}
 .brand{position:relative;min-height:50px}.brand-clouds{position:relative;width:50px;height:45px;flex:none;display:flex;align-items:flex-end;justify-content:center}.brand-clouds:before,.brand-clouds:after,.brand-clouds i{content:'';position:absolute;display:block;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0f2a4a18}.brand-clouds:before{width:44px;height:17px;left:3px;bottom:3px;border-radius:20px}.brand-clouds:after{width:22px;height:22px;left:10px;bottom:10px}.brand-clouds i:first-child{width:18px;height:18px;right:7px;bottom:10px}.brand-clouds i:last-child{width:11px;height:11px;right:0;bottom:2px}.brand-clouds img{position:relative;z-index:1;width:42px;height:42px;object-fit:contain;transform:translateY(-5px);filter:drop-shadow(0 3px 2px #0f2a4a1c)}.brand-name{display:flex;flex-direction:column;line-height:1}.brand-name b{font-size:21px}.brand-name small{margin-top:4px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.08em}.avatar-choice,.avatar-choice.on{border:0;background:transparent;box-shadow:none;padding:0;min-height:82px}.avatar-choice img{filter:none}.onboarding .hero{grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr)}.onboarding .hero>div{min-width:0}.onboarding .choice-card{width:100%;border:2px solid var(--mist);border-radius:18px;background:var(--card);padding:12px;box-shadow:0 4px 14px #0f2a4a0b}.onboarding .choice-card .event{margin-top:8px}.onboarding .hero .mascot-wrap{justify-self:center}.onboarding .emoji-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.onboarding .emoji-picker button{min-height:45px;border:2px solid var(--mist);background:var(--card);border-radius:13px;font-size:22px}.onboarding .emoji-picker button.on{border-color:var(--sky);background:var(--cloud);box-shadow:0 0 0 3px #1cb0f622}@media(max-width:560px){.onboarding .hero{grid-template-columns:1fr}.brand-name small{display:none}}

/* ===== UX layer v2 ===== */
:root{--shadow:0 1px 2px #0f2a4a10,0 8px 24px -8px #0f2a4a24;--ease:cubic-bezier(.2,.8,.2,1)}
body.dark{--shadow:0 1px 2px #0006,0 10px 28px -10px #000a}
body{-webkit-font-smoothing:antialiased;line-height:1.45}
.card{border-width:1.5px;transition:box-shadow .2s}
.card h1{font-size:clamp(25px,6.5vw,31px);letter-spacing:-.02em}.card h2{letter-spacing:-.01em}
.muted{font-weight:600;line-height:1.5}
.top{padding:10px 16px 10px;backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent);border-bottom-width:1.5px}
.top.compact .stats{display:none}.top.compact .activity-chip{display:none}
.top.compact.page .brand span{opacity:.0}
.stats{gap:8px}.stat{border-width:1.5px;font-weight:700;color:var(--muted);font-size:11px;line-height:1.25;padding:8px 4px}.stat b{font-size:18px;font-weight:900;margin-bottom:1px}
.icon{width:44px;height:44px;display:grid;place-items:center}
.btn{min-height:48px;transition:transform .12s var(--ease),border-bottom-width .12s,filter .15s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}.btn:hover{filter:brightness(1.04)}
.btn:disabled{opacity:.5;filter:grayscale(.4)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:3px;box-shadow:0 0 0 6px var(--card)}
.main.enter{animation:enter .28s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
/* nav */
.tabs{width:min(520px,calc(100% - 20px));bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:1.5px solid var(--mist);border-radius:26px;box-shadow:0 12px 32px -8px #0f2a4a40;align-items:center}
.tab{position:relative;min-height:54px;border:0;border-radius:20px;color:var(--muted);font-weight:800;transition:color .2s,background .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.tab.on{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--deep)}.tab.on svg{transform:translateY(-1px) scale(1.08)}
body.dark .tab.on{color:var(--sky)}
.tab.plus{width:56px;height:56px;min-height:0;margin:-18px auto 0;border-radius:50%;background:var(--sky);color:#fff;box-shadow:0 8px 18px -4px color-mix(in srgb,var(--sky) 70%,#000),0 0 0 5px var(--card);transition:transform .15s var(--ease)}
.tab.plus:active{transform:scale(.92)}.tab.plus svg{width:28px;height:28px;stroke-width:2.6}
#app{padding-bottom:116px}
/* goals + checks */
.check{width:38px;height:38px;border-width:2.5px;transition:background .2s,border-color .2s}
.check.done{color:#fff;font-weight:900}.check.pop{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(1.25)}}
.goal{padding:13px 0;border-top-width:1.5px}.goal-title{line-height:1.3}
.pill{font-weight:800}body.dark .pill.high{background:#5a2a33}body.dark .pill.medium{background:#524416}body.dark .pill.low{background:#17463a}
.pill.high{color:#8a1f2b}.pill.medium{color:#6b5200}.pill.low{color:#0f5c3f}body.dark .pill{color:var(--navy)}
.progress i,.stepbar i{transition:width .5s var(--ease),background .3s}
/* sheet */
.overlay{background:#0f2a4a8c;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{border-radius:28px 28px 0 0;max-height:90vh;overscroll-behavior:contain;animation:slide .3s var(--ease);box-shadow:0 -12px 40px #0f2a4a30}
.grab{width:42px;height:5px;border-radius:9px;background:var(--mist);margin:-8px auto 14px;touch-action:none;cursor:grab}
.modal .field input,.modal .field textarea,.modal .field select{min-height:48px;font-size:16px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom));animation:enter .25s var(--ease);max-width:calc(100% - 32px);text-align:center}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== Duolingo-style layer ===== */
.card{border-width:2px;border-bottom-width:4px;box-shadow:none}
.btn{color:#fff;text-transform:uppercase;letter-spacing:.05em;font-weight:900;font-size:14px;border-radius:16px;border-bottom-width:4px;text-shadow:0 1px 0 #0002}
.btn.ghost{color:var(--deep);text-shadow:none;background:var(--card)}body.dark .btn.ghost{color:var(--sky)}
.btn.full{width:100%}
.pill{border:2px solid var(--mist);background:var(--card);padding:3px 10px;font-weight:900}
.pill.high,.pill.medium,.pill.low{border-color:transparent}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seg button{flex:1;min-width:max-content;padding:9px 14px;border:2px solid var(--mist);border-bottom-width:4px;border-radius:14px;background:var(--card);font-weight:800;color:var(--muted);transition:transform .1s}
.seg button:active{transform:translateY(2px);border-bottom-width:2px}
.seg button.on{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--card));color:var(--deep)}body.dark .seg button.on{color:var(--sky)}
.progress{height:16px;background:var(--mist)}.progress i{position:relative;min-width:16px}
.progress i:after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:#fff5}
.stat{border-width:2px;border-bottom-width:4px;background:var(--card)}
.top{border-bottom-width:2px}
.card.today{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 9%,var(--card))}
.card.today h2:before{content:'★ ';color:var(--sun)}
.card.today .btn.mint{white-space:nowrap}
.goalhead{display:flex;align-items:center;gap:14px}.goalhead .mascot{width:72px;height:72px;margin:0;flex:none}
.goalhead .progress{margin:10px 0 4px}
.sec-title{margin:18px 4px 8px;font-size:15px;font-weight:900;color:var(--muted);display:flex;align-items:center;gap:8px}
.quest{display:grid;gap:12px;padding:14px;margin-bottom:12px;border:2px solid var(--mist);border-bottom-width:4px;border-radius:20px;background:var(--card)}
.quest.aim{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 6%,var(--card))}
.quest.done{opacity:.7}.quest.done .goal-title{text-decoration:line-through}
.quest .next{background:var(--cloud);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.quest .next span{font-size:12px;font-weight:900;color:var(--mint)}
.quest .stepbar{margin:0}
/* onboarding */
.obar{height:14px;border-radius:99px;background:var(--mist);margin:2px 2px 14px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s var(--ease)}
.ob>.card:last-child{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -10px 24px -10px #0f2a4a30}
.ob>.card:last-child .btn:not(.ghost){flex:2}
.conf{position:fixed;z-index:60;width:9px;height:9px;border-radius:3px;pointer-events:none;animation:conf .65s var(--ease) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.3);opacity:0}}

/* ===== Skybound finish pass ===== */
:root{--ink:#173b64;--soft-ink:#64809b;--line:#c7e4f5;--sky-wash:#eef9ff;--sky-deep:#0b78c9;--gold:#ffc928;--soft-shadow:0 18px 50px -28px #16456e66}
body{background:radial-gradient(circle at 14% -5%,#fff 0 14%,transparent 34%),linear-gradient(180deg,#edf9ff 0%,#e8f5fc 54%,#f6fbfe 100%);color:var(--ink)}
body:before,body:after{content:'';position:fixed;z-index:-1;border-radius:999px;pointer-events:none;filter:blur(1px);opacity:.75}
body:before{width:260px;height:100px;left:-90px;top:24%;background:#fff;box-shadow:90px 18px 0 -16px #fff,150px -10px 0 -24px #fff}
body:after{width:320px;height:120px;right:-150px;top:62%;background:#fff;box-shadow:-100px 18px 0 -15px #fff,-165px -5px 0 -28px #fff}
#app{max-width:960px;background:transparent;position:relative}
.top{max-width:960px;margin:0 auto;padding:14px max(18px,calc((100% - 820px)/2)) 12px;box-shadow:0 8px 28px -24px #16456e66}
.topline,.activity-chip,.stats{max-width:820px;margin-left:auto;margin-right:auto}
.main{max-width:820px;margin:0 auto;padding:22px 18px 140px}

  function render(){setTheme();const root=document.getElementById('app');if(!act()||ui.page==='onboarding')root.innerHTML=onboarding()+modal();else root.innerHTML=top()+page()+nav()+modal()+(ui.toast?'<div class="toast">'+esc(ui.toast)+'</div>':'');root.querySelectorAll('.modal [data-action]').forEach(el=>el.addEventListener('click',click))}

  function submit(e){const f=e.target;if(!f.dataset.form)return;e.preventDefault();const d=fd(f),t=f.dataset.form,a=act();if(t==='activity'){const x={id:uid('act'),name:d.name.trim(),icon:d.icon,color:d.color,isExample:false};S.activities.push(x);S.currentActivityId=x.id;ui.modal=null;mutate(()=>{},'Activity created');return}if(t==='goal'){S.goals.push({id:uid('goal'),activityId:a.id,title:d.title.trim(),priority:d.priority,nextAction:'',successDefinition:'',isInCurrentAim:!!d.aim,completedAt:null,retiredAt:null,feedbackId:null,steps:[],timeline:[{timestamp:Date.now(),description:'Goal created'}],createdAt:Date.now(),isExample:false});ui.modal=null;mutate(()=>{},'Goal saved');return}if(t==='feedback'){const fb={id:uid('fb'),activityId:a.id,coachName:d.coach||'',note:d.note.trim(),createdAt:Date.now(),isExample:false};S.feedback.push(fb);[1,2,3].forEach(i=>{if((d['goal'+i]||'').trim())S.goals.push({id:uid('goal'),activityId:a.id,title:d['goal'+i].trim(),priority:d['priority'+i]||'M',nextAction:'',successDefinition:'',isInCurrentAim:aim().length<3,completedAt:null,retiredAt:null,feedbackId:fb.id,steps:[],timeline:[{timestamp:Date.now(),description:'Created from feedback'}],createdAt:Date.now(),isExample:false})});ui.modal=null;mutate(()=>{},'Feedback saved');return}if(t==='session'){S.sessions.push({id:uid('ses'),activityId:a.id,title:d.title.trim(),dateKey:d.date,time:d.time||'',weekly:!!d.weekly,completedDates:[],createdAt:Date.now(),isExample:false});ui.modal=null;mutate(()=>{},'Session scheduled');return}if(t==='habit'){S.habits.push({id:uid('hab'),activityId:a.id,title:d.title.trim(),targetDays:Number(d.target)||3,linkedGoalId:d.goal||null,loggedDates:[],createdAt:Date.now(),isExample:false});ui.modal=null;mutate(()=>{},'Habit added');return}if(t==='record'){S.records.push({id:uid('rec'),activityId:a.id,title:d.title.trim(),note:d.note||'',dateKey:d.date||today(),createdAt:Date.now(),isExample:false});ui.modal=null;mutate(()=>{},'Personal best saved');return}if(t   function click(e){const x=e.target.closest('[data-action]');if(!x)return;const a=x.dataset.action,id=x.dataset.id;if(a==='tab'){ui.tab=x.dataset.tab;ui.page=null;render()}else if(a==='open-page'){ui.page=x.dataset.page;ui.tab='more';render()}else if(a==='back'){ui.page=null;render()}else if(a==='open'){open(x.dataset.modal,id)}else if(a==='close'){ui.modal=null;render()}else if(a==='quick'){open('quick')}else if(a==='new-activity'){open('activity')}else if(a==='onboard-next'){ui.onboard=Math.min(10,(ui.onboard||0)+1);render()}else if(a==='onboard-back'){ui.onboard=Math.max(0,(ui.onboard||0)-1);render()}else if(a==='onboard-skip'){ui.onboard=5;render()}else if(a==='activity-picker'){open('activity-picker')}else if(a==='example'){loadExample()}else if(a==='remove-example'){removeExamples()}else if(a==='switch'){S.currentActivityId=id;ui.modal=null;mutate(()=>{},'Activity switched')}else if(a==='delete-activity'){if(confirm('Delete this activity and all its data?')){S.activities=S.activities.filter(x=>x.id!==id);['goals','feedback','sessions','habits','records'].forEach(k=>S[k]=S[k].filter(x=>x.activityId!==id));S.currentActivityId=S.activities[0]?.id||null;mutate(()=>{},'Activity deleted')}}else if(a==='goal-done'){const g=goals().find(x=>x.id===id);if(g){g.completedAt=g.completedAt?null:Date.now();g.timeline.push({timestamp:Date.now(),description:g.completedAt?'Goal completed':'Goal reopened'});mutate(()=>{},'Goal updated')}}else if(a==='goal-aim'){const g=goals().find(x=>x.id===id);if(g){if(g.isInCurrentAim)g.isInCurrentAim=false;else if(aim().length<3)g.isInCurrentAim=true;mutate(()=>{},'Current Aim updated')}}else if(a==='goal-detail'){open('goal-detail',id)}else if(a==='delete-goal'){if(confirm('Delete this goal?')){S.goals=S.goals.filter(x=>x.id!==id);ui.modal=null;mutate(()=>{},'Goal deleted')}}else if(a==='reopen'){const g=goals().find(x=>x.id===id);if(g){g.completedAt=null;g.retiredAt=null;ui.modal=null;mutate(()=>{},'Goal reopened')}}else if(a==='review'){ function polish(entering){const r=document.getElementById('app'),h=r.querySelector('.top');
 if(h){h.classList.toggle('compact',!(ui.tab==='home'&&!ui.page));h.classList.toggle('page',!!ui.page)}

let lastT=0;
function goalsView(){if(!act())return onboarding();const all=goals(),st=ui.status||'active',pr=ui.priority||'all',live=all.filter(g=>!g.retiredAt),dn=live.filter(g=>g.completedAt).length,pct=live.length?Math.round(dn/live.length*100):0;

 const focus=st==='active'&&pr==='all'?l.filter(g=>g.isInCurrentAim):[],rest=l.filter(g=>!focus.includes(g)),chip=(a,v,t,c)=>'<button class="'+(c===v?'on':'')+'" data-action="'+a+'" data-value="'+v+'">'+t+'</button>';

 +'<div class="seg">'+[['active','Active'],['done','Done'],['retired','Retired'],['all','All']].map(x=>chip('status',x[0],x[1],st)).join('')+'</div><div class="seg" style="margin-top:8px">'+[['all','Any priority'],['H','High'],['M','Medium'],['L','Low']].map(x=>chip('priority',x[0],x[1],pr)).join('')+'</div>'

 +(l.length?'<button class="btn ghost full" style="margin-top:6px" data-action="open" data-modal="feedback">Record feedback</button>':'')+'</main>'}
function polish2(){const r=document.getElementById('app'),mn=r.querySelector('.main');if(!mn)return;
